<div class="performance-chart-container">
  <div class="chart-header">
    <h3>业绩表现</h3>
    <div class="period-selector">
      <mat-button-toggle-group [value]="selectedPeriod" (change)="onPeriodChange($event.value)">
        <mat-button-toggle *ngFor="let period of periodOptions" [value]="period.value">
          {{ period.label }}
        </mat-button-toggle>
      </mat-button-toggle-group>
    </div>
  </div>

  <div class="charts-container" *ngIf="!isLoading && performance && navHistory.length > 0">
    <!-- 净值走势图 -->
    <div class="chart-section">
      <h4>净值走势</h4>
      <canvas baseChart
              [data]="navChartConfig?.data"
              [options]="navChartConfig?.options"
              [type]="'line'">
      </canvas>
    </div>

    <!-- 收益率图表 -->
    <div class="chart-section" *ngIf="returnChartConfig">
      <h4>收益率分布</h4>
      <canvas baseChart
              [data]="returnChartConfig.data"
              [options]="returnChartConfig.options"
              [type]="'bar'">
      </canvas>
    </div>
  </div>

  <!-- 加载状态 -->
  <div class="loading-state" *ngIf="isLoading">
    <mat-spinner></mat-spinner>
    <p>加载中...</p>
  </div>

  <!-- 空状态 -->
  <div class="empty-state" *ngIf="!isLoading && (!performance || navHistory.length === 0)">
    <mat-icon>show_chart</mat-icon>
    <p>暂无业绩数据</p>
  </div>
</div>
