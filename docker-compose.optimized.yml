# 优化版本的 Docker Compose 配置
version: '3.8'

services:
  # 基础设施服务
  postgres:
    image: postgres:15
    container_name: fund_monitor_postgres_opt
    environment:
      POSTGRES_DB: fund_monitor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - fund_monitor_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3

  redis:
    image: redis:7-alpine
    container_name: fund_monitor_redis_opt
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - fund_monitor_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  influxdb:
    image: influxdb:2.7
    container_name: fund_monitor_influxdb_opt
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: password123
      DOCKER_INFLUXDB_INIT_ORG: fund_monitor
      DOCKER_INFLUXDB_INIT_BUCKET: nav_data
    ports:
      - "8086:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
    networks:
      - fund_monitor_network
    restart: unless-stopped

  # 构建基础镜像
  base-builder:
    build:
      context: .
      dockerfile: Dockerfile.base
      target: fund-monitor-base
    image: fund-monitor-base:latest
    profiles:
      - build

  # 微服务 - 使用优化后的基础镜像
  auth_service:
    build:
      context: .
      dockerfile: backend/services/auth/Dockerfile
      cache_from:
        - fund-monitor-base:latest
    container_name: fund_monitor_auth_opt
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fund_monitor
      REDIS_URL: redis://redis:6379
      SECRET_KEY: your-secret-key-here
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fund_monitor_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  data_collector:
    build:
      context: .
      dockerfile: backend/services/data_collector/Dockerfile
      cache_from:
        - fund-monitor-base:latest
    container_name: fund_monitor_data_collector_opt
    ports:
      - "8001:8001"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fund_monitor
      REDIS_URL: redis://redis:6379
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: your-influxdb-token
      INFLUXDB_ORG: fund_monitor
      INFLUXDB_BUCKET: nav_data
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_started
    networks:
      - fund_monitor_network
    restart: unless-stopped

  monitor_engine:
    build:
      context: .
      dockerfile: backend/services/monitor_engine/Dockerfile
      cache_from:
        - fund-monitor-base:latest
    container_name: fund_monitor_monitor_opt
    ports:
      - "8002:8002"
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/fund_monitor
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - fund_monitor_network
    restart: unless-stopped

  # 前端服务 - 使用多阶段构建
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
      cache_from:
        - fund-monitor-frontend:latest
    container_name: fund_monitor_frontend_opt
    ports:
      - "3000:3000"
    environment:
      API_BASE_URL: http://localhost:8000
    depends_on:
      - auth_service
      - data_collector
      - monitor_engine
    networks:
      - fund_monitor_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Angular前端
  angular_frontend:
    build:
      context: ./frontend/angular-app
      dockerfile: Dockerfile
      target: production
      cache_from:
        - fund-monitor-angular:latest
    container_name: fund_monitor_angular_opt
    ports:
      - "8080:8080"
    depends_on:
      - frontend
    networks:
      - fund_monitor_network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  redis_data:
  influxdb_data:

networks:
  fund_monitor_network:
    driver: bridge